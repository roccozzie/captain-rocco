<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Captain Rocco — Airliner Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ink:#e8ecf4;
    --amber:#ffb52e;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:#0b0d10;
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    position:fixed; inset:0;
  }
  #game{
    position:absolute; inset:0;
    width:100vw; height:100dvh;
    display:block;
    touch-action:none;
  }

  /* ---------- round corner buttons (grownups) ---------- */
  .cornerBtn{
    position:absolute; z-index:12;
    width:44px; height:44px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.35);
    background:rgba(10,13,18,0.55);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
    touch-action:none;
  }
  .cornerBtn svg{ width:24px; height:24px; display:block; }
  #soundBtn{
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    right:calc(env(safe-area-inset-right, 0px) + 10px);
  }
  #soundBtn .waves{ transition:opacity 0.15s; }
  #soundBtn.muted .waves{ opacity:0; }
  #soundBtn .slash{ opacity:0; transition:opacity 0.15s; }
  #soundBtn.muted .slash{ opacity:1; }
  #tiltBtn{
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    left:calc(env(safe-area-inset-left, 0px) + 10px);
  }
  #tiltBtn.on{ border-color:var(--amber); background:rgba(80,52,4,0.65); }

  /* ---------- rotate hint (portrait only) ---------- */
  #rotateHint{
    position:absolute; z-index:11;
    top:calc(env(safe-area-inset-top, 0px) + 64px);
    left:50%; transform:translateX(-50%);
    display:none; pointer-events:none;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.6));
  }
  @media (orientation: portrait){
    #rotateHint{ display:block; animation:hintRock 2.2s ease-in-out infinite; }
  }
  @keyframes hintRock{
    0%,55%,100%{ transform:translateX(-50%) rotate(0deg); }
    75%{ transform:translateX(-50%) rotate(90deg); }
  }

  /* ---------- START ENGINES overlay ---------- */
  #startOverlay{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(5,8,14,0.30) 0%, rgba(3,5,9,0.80) 100%);
    transition:opacity 0.7s ease, visibility 0.7s;
    padding:16px;
  }
  #startOverlay.gone{ opacity:0; visibility:hidden; pointer-events:none; }
  .startInner{ text-align:center; }
  .startTitle{
    font-family:"Baloo 2", sans-serif; font-weight:800;
    font-size:clamp(30px, 7.5vw, 58px); letter-spacing:0.05em; line-height:1;
    color:#fff; text-shadow:0 3px 0 rgba(230,57,70,0.85), 0 10px 26px rgba(0,0,0,0.6);
  }
  .startTitle .jet{ color:#ffd94d; text-shadow:0 3px 0 rgba(47,123,255,0.85), 0 10px 26px rgba(0,0,0,0.6); }
  .startSub{
    margin-top:8px; font-family:"Barlow Condensed", sans-serif; font-weight:600;
    font-size:clamp(15px, 3.4vw, 21px); letter-spacing:0.22em; text-transform:uppercase;
    color:#ffd94d;
  }
  #startBtn{
    margin-top:26px;
    font-family:"Baloo 2", sans-serif; font-weight:800;
    font-size:clamp(26px, 5.6vw, 40px); letter-spacing:0.03em;
    color:#2a1503;
    background:linear-gradient(180deg, #ffd94d 0%, #ffb52e 55%, #ff9412 100%);
    border:3px solid rgba(255,255,255,0.55);
    border-radius:18px;
    padding:0.5em 1.15em;
    box-shadow:0 12px 32px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.65), inset 0 -4px 0 rgba(146,74,0,0.45);
    cursor:pointer;
    touch-action:manipulation;
  }
  #startBtn:active{ transform:scale(0.97); }
  .startHint{
    margin-top:16px; font-size:14px; font-weight:500; color:rgba(232,236,244,0.75);
    letter-spacing:0.06em;
  }
  @media (prefers-reduced-motion: reduce){
    #rotateHint{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="rotateHint" aria-hidden="true">
  <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
    <rect x="17" y="6" width="18" height="32" rx="4" stroke="#fff" stroke-width="3"/>
    <path d="M40 34a15 15 0 1 1-4.2-10.4" stroke="#ffd94d" stroke-width="3" stroke-linecap="round"/>
    <path d="M36.5 15.5l-.3 8.6-8.4-1.6" stroke="#ffd94d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<button id="tiltBtn" class="cornerBtn" aria-label="Toggle tilt steering">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="7" y="3.5" width="10" height="17" rx="2.5" stroke="#fff" stroke-width="1.8"/>
    <path d="M19.5 8.5a8.5 8.5 0 0 1 1 5.5M4.6 8.2a8.5 8.5 0 0 0-.4 5.6" stroke="#ffd94d" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M20.8 10.2l-.3 3.8-3.6-.7M3.4 10l.3 3.8 3.6-.7" stroke="#ffd94d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<button id="soundBtn" class="cornerBtn" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9.5v5h3.5L12 18.6V5.4L7.5 9.5H4z" fill="#fff"/>
    <path class="waves" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path class="slash" d="M4 4l16 16" stroke="#ffd94d" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
</button>

<div id="startOverlay">
  <div class="startInner">
    <div class="startTitle">CAPTAIN <span class="jet">ROCCO</span></div>
    <div class="startSub">Airlines</div>
    <button id="startBtn" type="button">START ENGINES</button>
    <div class="startHint">sound on for the engines</div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   CAPTAIN ROCCO — AIRLINER COCKPIT (v3)
   A calm, toddler-proof commercial jet flight deck.
   Take off, cruise above the clouds, press LAND and the jet
   lands itself. It cannot crash — the plane helps him fly.
   Everything is drawn on canvas and synthesized with WebAudio.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const soundBtn = document.getElementById('soundBtn');
const tiltBtn = document.getElementById('tiltBtn');

let W = 0, H = 0, DPR = 1;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
function measureSafe(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);';
  document.body.appendChild(probe);
  const r = probe.getBoundingClientRect();
  SAFE.t = Math.max(0, r.top); SAFE.l = Math.max(0, r.left);
  SAFE.r = Math.max(0, window.innerWidth - r.right); SAFE.b = Math.max(0, window.innerHeight - r.bottom);
  probe.remove();
}

/* ---------------- helpers ---------------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rad = d => d * Math.PI / 180;
const rand = (a, b) => a + Math.random() * (b - a);
function lerpColor(c1, c2, t){
  return [ Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t)) ];
}
const css = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
function hash2(i, j){ const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function fmtInt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtHdg(h){ const r = ((Math.round(h) % 360) + 360) % 360; return String(r === 0 ? 360 : r).padStart(3, '0'); }
function roundRectPath(c, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function inRect(x, y, r){ return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = t => t * t * (3 - 2 * t);

/* ============================================================
   AUDIO — quiet airliner fan hum + soft rumble. No roar.
   Master sits well below v2. The DING is the loudest event,
   and even the DING is mellow.
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  fanGain: null, fanOsc1: null, fanOsc2: null,
  whineOsc: null, whineGain: null,
  windGain: null, windFilter: null, rumbleGain: null,
  init(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = this.ctx = new AC();
    this.master = ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(ac.destination);

    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    const mkSrc = () => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; return s; };

    /* fan hum: two softly detuned low sines */
    this.fanGain = ac.createGain(); this.fanGain.gain.value = 0;
    this.fanGain.connect(this.master);
    this.fanOsc1 = ac.createOscillator(); this.fanOsc1.type = 'sine'; this.fanOsc1.frequency.value = 72;
    this.fanOsc2 = ac.createOscillator(); this.fanOsc2.type = 'sine'; this.fanOsc2.frequency.value = 145;
    const f2g = ac.createGain(); f2g.gain.value = 0.38;
    this.fanOsc1.connect(this.fanGain);
    this.fanOsc2.connect(f2g); f2g.connect(this.fanGain);
    this.fanOsc1.start(); this.fanOsc2.start();

    /* a whisper of fan whine, kept far below piercing */
    this.whineOsc = ac.createOscillator(); this.whineOsc.type = 'triangle'; this.whineOsc.frequency.value = 560;
    const wLP = ac.createBiquadFilter(); wLP.type = 'lowpass'; wLP.frequency.value = 1700;
    this.whineGain = ac.createGain(); this.whineGain.gain.value = 0;
    this.whineOsc.connect(wLP); wLP.connect(this.whineGain); this.whineGain.connect(this.master);
    this.whineOsc.start();

    /* engine + runway rumble: noise through a lowpass */
    const rLP = ac.createBiquadFilter(); rLP.type = 'lowpass'; rLP.frequency.value = 300;
    this.rumbleGain = ac.createGain(); this.rumbleGain.gain.value = 0;
    const rSrc = mkSrc();
    rSrc.connect(rLP); rLP.connect(this.rumbleGain); this.rumbleGain.connect(this.master);
    rSrc.start();

    /* soft wind */
    this.windFilter = ac.createBiquadFilter();
    this.windFilter.type = 'bandpass'; this.windFilter.frequency.value = 620; this.windFilter.Q.value = 0.5;
    this.windGain = ac.createGain(); this.windGain.gain.value = 0;
    const wSrc = mkSrc();
    wSrc.connect(this.windFilter); this.windFilter.connect(this.windGain); this.windGain.connect(this.master);
    wSrc.start();
  },
  /* called every frame once running */
  update(spool, throttle, speed, onGround, gearTransit){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const n1 = spool * (0.3 + 0.7 * throttle);
    this.fanOsc1.frequency.setTargetAtTime(62 + n1 * 48, t, 0.16);
    this.fanOsc2.frequency.setTargetAtTime((62 + n1 * 48) * 2.01, t, 0.16);
    this.fanGain.gain.setTargetAtTime(spool * (0.020 + throttle * 0.032), t, 0.16);
    this.whineOsc.frequency.setTargetAtTime(460 + n1 * 520, t, 0.2);
    this.whineGain.gain.setTargetAtTime(spool * throttle * 0.005, t, 0.2);
    let rum = spool * (0.013 + throttle * 0.018);
    if (onGround) rum += clamp(speed / 150, 0, 1) * 0.045;
    if (gearTransit > 0) rum += 0.018;
    this.rumbleGain.gain.setTargetAtTime(rum, t, 0.12);
    this.windFilter.frequency.setTargetAtTime(400 + speed * 0.9, t, 0.2);
    this.windGain.gain.setTargetAtTime(spool * clamp(speed / 480, 0, 1) * 0.04 * (onGround ? 0.35 : 1), t, 0.2);
  },
  tone(f0, f1, dur, type, vol, delay){
    if (!this.ctx) return;
    const ac = this.ctx, t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(f0, 1), t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noiseBurst(dur, freq, vol, delay, type){
    if (!this.ctx) return;
    const ac = this.ctx, t0 = ac.currentTime + (delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = rand(0.9, 1.1);
    const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },
  click(){ this.noiseBurst(0.04, 2200, 0.06, 0); this.tone(1300, 900, 0.04, 'square', 0.018, 0); },
  clunk(v){
    this.tone(86, 45, 0.2, 'sine', 0.15 * (v || 1), 0);
    this.noiseBurst(0.14, 260, 0.09 * (v || 1), 0, 'lowpass');
  },
  /* the cabin DING — soft two-tone seatbelt chime */
  ding(){
    this.tone(831, 831, 0.55, 'sine', 0.12, 0);
    this.tone(622, 622, 0.75, 'sine', 0.12, 0.30);
  },
  celebrate(){
    this.ding();
    const notes = [523, 659, 784, 1047];
    for (let i = 0; i < notes.length; i++) this.tone(notes[i], notes[i], 0.36, 'sine', 0.07, 0.8 + i * 0.13);
  },
  positiveRate(){
    this.tone(1046, 1046, 0.07, 'sine', 0.04, 0);
    this.tone(1046, 1046, 0.07, 'sine', 0.04, 0.17);
  },
  squelch(delay){ this.noiseBurst(0.07, 1400, 0.045, delay || 0); },
  radioChatter(){
    this.squelch(0);
    this.tone(880, 880, 0.08, 'sine', 0.045, 0.16);
    this.tone(659, 659, 0.08, 'sine', 0.045, 0.30);
    this.tone(988, 988, 0.11, 'sine', 0.045, 0.44);
    this.squelch(0.95);
  },
  apOn(){ this.tone(740, 740, 0.09, 'sine', 0.05, 0); this.tone(988, 988, 0.12, 'sine', 0.05, 0.11); },
  apOff(){ this.tone(988, 988, 0.09, 'sine', 0.045, 0); this.tone(740, 740, 0.12, 'sine', 0.045, 0.11); },
  assistBeep(){
    this.tone(1175, 1175, 0.08, 'sine', 0.035, 0);
    this.tone(1175, 1175, 0.08, 'sine', 0.035, 0.15);
  },
  setMuted(m){
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.5, this.ctx.currentTime, 0.03);
  }
};

/* ============================================================
   STATE
   Phases: ground → takeoff → air → landing → rollout → ground…
   ============================================================ */
const FIELD_ALT = 500;
const S = {
  started: false, time: 0,
  spool: 0, power: 0, effPower: 0,
  phase: 'ground',
  throttle: 0.1, throttleCmd: 0.1, autoThrottle: false,
  speed: 0, altitude: FIELD_ALT, vs: 0, heading: 0, dist: 0, groundDist: 0,
  pitchDeg: 0, bankDeg: 0,
  inPitch: 0, inBank: 0, viewActive: false,
  rotateProg: 0,
  gearDown: true, gearTransit: 0, gearHintT: 0, gearAutoT: -1, posRateT: -1,
  lightsNight: false, autopilot: false, seatbelt: true,
  radioT: 0, radioFreq: '121.500',
  landT: 0, landDur: 20, landP: 0, landStartAlt: 0, landStartSpeed: 0, landStartThr: 0.3,
  airportVis: true,
  assist: false, nextBeep: 0,
  shakeT: 0, celebrateT: 0,
  sweepA: 0,
  press: {},
  tiltOn: false, tiltPitch: 0, tiltBank: 0
};
const RADIO_FREQS = ['118.700', '121.500', '124.350', '119.100', '126.825', '122.900'];

/* ============================================================
   LAYOUT — landscape is the designed experience; portrait
   stacks the same zones. Fewer, bigger, better-grouped parts.
   ============================================================ */
let L = null;
function computeLayout(){
  const portrait = H > W;
  const padL = 8 + SAFE.l, padR = 8 + SAFE.r;
  const innerW = W - padL - padR;
  const gap = 8;
  L = { portrait };
  if (!portrait){
    L.panelY = Math.round(H * 0.47);
    L.view = { x: 4, y: 4, w: W - 8, h: L.panelY - 2 };
    L.panelH = H - L.panelY;
    const py = L.panelY + 8, ph = L.panelH - 16;
    const pfdW = clamp(innerW * 0.27, 150, 300);
    const ndW = clamp(innerW * 0.235, 130, 260);
    const thrW = clamp(innerW * 0.115, 84, 124);
    const midW = innerW - pfdW - ndW - thrW - gap * 3;
    let x = padL;
    L.pfd = { x, y: py, w: pfdW, h: ph }; x += pfdW + gap;
    L.nd = { x, y: py, w: ndW, h: ph }; x += ndW + gap;
    L.mid = { x, y: py, w: midW, h: ph }; x += midW + gap;
    L.thr = { x, y: py, w: thrW, h: ph };
    L.seps = [L.pfd.x + pfdW + gap / 2, L.nd.x + ndW + gap / 2, L.mid.x + midW + gap / 2];
    layoutMid(3, 2, 46);
    L.yokes = [
      { x: L.pfd.x + pfdW / 2, s: 1 },
      { x: L.nd.x + ndW / 2, s: 0.92 }
    ];
  } else {
    L.panelY = Math.round(H * 0.36);
    L.view = { x: 4, y: 4, w: W - 8, h: L.panelY - 2 };
    L.panelH = H - L.panelY;
    const py = L.panelY + 8;
    const pfdW = Math.min(innerW * 0.78, 360);
    const pfdH = clamp(L.panelH * 0.32, 130, 210);
    L.pfd = { x: (W - pfdW) / 2, y: py, w: pfdW, h: pfdH };
    const row2Y = py + pfdH + 10;
    const row2H = clamp(L.panelH * 0.30, 120, 190);
    const ndW = innerW * 0.44;
    L.nd = { x: padL, y: row2Y, w: ndW, h: row2H };
    L.mid = { x: padL + ndW + gap, y: row2Y, w: innerW - ndW - gap, h: row2H };
    L.action = { x: padL, y: row2Y + row2H + 10, w: innerW, h: 48 };
    const thrY = L.action.y + 58;
    L.thr = { x: W - padR - 92, y: thrY, w: 92, h: Math.max(H - SAFE.b - 10 - thrY, 90) };
    L.seps = [];
    layoutMid(2, 3, 0);
    L.yokes = [{ x: W / 2 - 74, s: 1 }];
  }
  layoutThr();
  L.yokeBaseY = H - SAFE.b + 10;
  L.buttons = [
    { id: 'gear', rect: L.cells.gear },
    { id: 'ding', rect: L.cells.ding },
    { id: 'lights', rect: L.cells.lights },
    { id: 'radio', rect: L.cells.radio },
    { id: 'ap', rect: L.cells.ap },
    { id: 'action', rect: L.action }
  ];
}
function layoutMid(cols, rows, actH){
  const m = L.mid;
  L.placard = { x: m.x, y: m.y, w: m.w, h: 20 };
  if (!L.portrait) L.action = { x: m.x, y: m.y + m.h - actH, w: m.w, h: actH };
  const gy = m.y + 26;
  const gh = m.h - 26 - (L.portrait ? 0 : actH + 8);
  const cw = (m.w - (cols - 1) * 6) / cols;
  const ch = (gh - (rows - 1) * 6) / rows;
  const order = ['gear', 'ding', 'lights', 'radio', 'ap', 'sign'];
  L.cells = {};
  order.forEach((id, i) => {
    const cx = m.x + (i % cols) * (cw + 6);
    const cy = gy + Math.floor(i / cols) * (ch + 6);
    L.cells[id] = { x: cx, y: cy, w: cw, h: ch };
  });
}
function layoutThr(){
  const z = L.thr;
  L.thrCx = z.x + z.w / 2;
  L.slotTop = z.y + 34;
  L.slotBot = z.y + z.h - 26;
  if (L.slotBot - L.slotTop < 40) L.slotTop = L.slotBot - 40;
}

/* ---------------- scenery data ---------------- */
let skyStars = [], clouds = [], radarBlobs = [], confetti = [];
function buildScenery(){
  skyStars = [];
  for (let i = 0; i < 70; i++) skyStars.push({ fx: Math.random(), fy: Math.random() * 0.5, r: rand(0.7, 1.8), p: rand(0, 6.28) });
  radarBlobs = [];
  for (let i = 0; i < 2; i++) radarBlobs.push({ a: rand(0, 6.28), d: rand(0.3, 0.75), s: rand(16, 28), type: 'wx', hue: i === 1 ? '255,190,60' : '80,255,140' });
  for (let i = 0; i < 3; i++) radarBlobs.push({ a: rand(0, 6.28), d: rand(0.25, 0.9), s: 3.5, type: 'tgt', hue: '160,255,200' });
  clouds = [];
  for (let i = 0; i < 7; i++) clouds.push(newCloud(true));
}
function newCloud(anywhere){
  return { dx: rand(-1, 1), dy: rand(-0.3, 1), z: anywhere ? rand(0.15, 1) : 1, s0: rand(0.7, 1.3), seed: rand(0, 100) };
}
let puffSprite = null, deckSprite = null;
function makeSprites(){
  /* soft single puff, for wisps drifting past the canopy */
  const c = document.createElement('canvas');
  c.width = 200; c.height = 124;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++){
    const x = 100 + rand(-52, 52), y = 62 + rand(-20, 20), r = rand(18, 42);
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.15)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  for (let i = 0; i < 7; i++){
    const x = 100 + rand(-36, 36), y = 60 + rand(-13, 13), r = rand(13, 26);
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.45)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  puffSprite = c;
  /* wide flat cloud-top cluster, tiled to build the deck */
  const d2 = document.createElement('canvas');
  d2.width = 300; d2.height = 110;
  const dg = d2.getContext('2d');
  for (let i = 0; i < 22; i++){
    const x = 150 + rand(-120, 120), y = 58 + rand(-22, 22), r = rand(24, 58);
    const gr = dg.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.20)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    dg.fillStyle = gr;
    dg.beginPath(); dg.arc(x, y, r, 0, 6.29); dg.fill();
  }
  for (let i = 0; i < 10; i++){
    const x = 150 + rand(-95, 95), y = 54 + rand(-14, 14), r = rand(16, 34);
    const gr = dg.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.5)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    dg.fillStyle = gr;
    dg.beginPath(); dg.arc(x, y, r, 0, 6.29); dg.fill();
  }
  deckSprite = d2;
}
function spawnConfetti(){
  const v = L.view;
  const cols = ['#ffd94d', '#ff6b81', '#4dc3ff', '#7dff8a', '#ffffff', '#ffb52e'];
  confetti = [];
  for (let i = 0; i < 90; i++){
    confetti.push({
      x: v.x + rand(0, v.w), y: v.y - rand(0, v.h * 0.5),
      vx: rand(-14, 14), vy: rand(35, 95),
      w: rand(4, 8), h: rand(6, 12),
      rot: rand(0, 6.28), vr: rand(-3.4, 3.4),
      color: cols[i % cols.length], life: rand(2.2, 3.2)
    });

/* ============================================================
   PHASE TRANSITIONS — the plane helps him. No fail states.
   ============================================================ */
function doGear(down){
  if (S.gearDown === down || S.gearTransit > 0) return;
  S.gearDown = down;
  S.gearTransit = 1;
  AudioSys.click();
  AudioSys.clunk(0.7);
}
function beginTakeoff(){
  if (S.phase !== 'ground' || S.spool < 0.85) return;
  S.phase = 'takeoff';
  S.rotateProg = 0;
  S.throttleCmd = 1;
  S.autoThrottle = true;
  S.seatbelt = true;
  S.airportVis = true;
  AudioSys.click();
}
function liftoff(){
  S.phase = 'air';
  S.gearHintT = 3.2;
  S.gearAutoT = S.time + 5;
  S.posRateT = S.time + 0.8;
}
function beginLanding(){
  if (S.phase !== 'air') return;
  S.phase = 'landing';
  S.landT = 0; S.landP = 0;
  S.landStartAlt = S.altitude;
  S.landStartSpeed = S.speed;
  S.landStartThr = S.throttle;
  S.landDur = clamp(16 + (S.altitude - FIELD_ALT) / 2200, 16, 30);
  S.autopilot = true;
  S.seatbelt = true;
  S.airportVis = true;
  AudioSys.ding();
  if (!S.gearDown && S.gearTransit === 0) doGear(true);
}
function touchdown(){
  S.phase = 'rollout';
  S.altitude = FIELD_ALT;
  S.vs = 0;
  S.shakeT = 0.55;
  AudioSys.clunk(0.9);
  AudioSys.noiseBurst(0.5, 200, 0.12, 0, 'lowpass');
}
function arrive(){
  S.phase = 'ground';
  S.throttleCmd = 0.1;
  S.autoThrottle = true;
  S.autopilot = false;
  S.celebrateT = 3;
  AudioSys.celebrate();
  spawnConfetti();
}

/* ============================================================
   INPUT — windshield drag steers (air only), thrust drags,
   buttons tap. Two pointers at once are supported.
   ============================================================ */
const pointers = new Map();
function setThrottleFromY(y){
  if (S.phase === 'landing' || S.phase === 'rollout') return;
  S.throttle = clamp(1 - (y - L.slotTop) / (L.slotBot - L.slotTop), 0, 1);
  S.throttleCmd = S.throttle;
  if (S.phase === 'takeoff') S.autoThrottle = false;
  if (S.phase === 'ground' && S.started && S.spool > 0.85 && S.throttle > 0.6) beginTakeoff();
}
function pressButton(id){
  S.press[id] = S.time;
  if (id === 'gear'){
    if (S.phase === 'air' || S.phase === 'landing'){
      S.gearAutoT = -1; S.gearHintT = 0;
      doGear(!S.gearDown);
    } else {
      AudioSys.click();
    }
  } else if (id === 'ding'){
    S.seatbelt = !S.seatbelt;
    AudioSys.ding();
  } else if (id === 'lights'){
    S.lightsNight = !S.lightsNight;
    AudioSys.click();
  } else if (id === 'radio'){
    S.radioT = 1.6;
    S.radioFreq = RADIO_FREQS[Math.floor(Math.random() * RADIO_FREQS.length)];
    AudioSys.radioChatter();
  } else if (id === 'ap'){
    if (S.phase === 'air'){
      S.autopilot = !S.autopilot;
      if (S.autopilot) AudioSys.apOn(); else AudioSys.apOff();
    } else {
      AudioSys.click();
    }
  } else if (id === 'action'){
    if (S.phase === 'ground') beginTakeoff();
    else if (S.phase === 'air') beginLanding();
  }
}
canvas.addEventListener('pointerdown', e => {
  if (!S.started) return;
  const x = e.clientX, y = e.clientY;
  for (const b of L.buttons){
    if (inRect(x, y, b.rect)){ pressButton(b.id); pointers.set(e.pointerId, { type: 'btn' }); return; }
  }
  if (inRect(x, y, L.thr)){ pointers.set(e.pointerId, { type: 'throttle' }); setThrottleFromY(y); return; }
  if (inRect(x, y, L.view) && S.phase === 'air'){
    pointers.set(e.pointerId, { type: 'view', sx: x, sy: y });
    S.viewActive = true;
    if (S.autopilot){ S.autopilot = false; AudioSys.apOff(); }
  }
});
window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (p.type === 'throttle') setThrottleFromY(e.clientY);
  else if (p.type === 'view'){
    S.inBank = clamp((e.clientX - p.sx) / 130, -1, 1);
    S.inPitch = clamp(-(e.clientY - p.sy) / 115, -1, 1);
  }
}, { passive: true });
function endPointer(e){
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (p.type === 'view'){ S.viewActive = false; S.inPitch = 0; S.inBank = 0; }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ---------- start / mute / tilt (DOM buttons) ---------- */
startBtn.addEventListener('click', () => {
  AudioSys.init();
  AudioSys.click();
  S.started = true;
  startOverlay.classList.add('gone');
});
soundBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); });
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  AudioSys.init();
  AudioSys.setMuted(!AudioSys.muted);
  soundBtn.classList.toggle('muted', AudioSys.muted);
});
tiltBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); });
let tiltBase = null;
function onOrient(e){
  if (!S.tiltOn || e.gamma === null || e.gamma === undefined) return;
  if (!tiltBase) tiltBase = { g: e.gamma, b: e.beta };
  const dg = e.gamma - tiltBase.g, db = e.beta - tiltBase.b;
  const ang = (window.screen && screen.orientation && typeof screen.orientation.angle === 'number')
    ? screen.orientation.angle : 0;
  if (ang === 90){ S.tiltBank = clamp(db / 22, -1, 1); S.tiltPitch = clamp(dg / 22, -1, 1); }
  else if (ang === 270 || ang === -90){ S.tiltBank = clamp(-db / 22, -1, 1); S.tiltPitch = clamp(-dg / 22, -1, 1); }
  else { S.tiltBank = clamp(dg / 22, -1, 1); S.tiltPitch = clamp(-db / 22, -1, 1); }
}
tiltBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (S.tiltOn){
    S.tiltOn = false; tiltBase = null;
    tiltBtn.classList.remove('on');
    window.removeEventListener('deviceorientation', onOrient);
    return;
  }
  const begin = () => {
    tiltBase = null;
    S.tiltOn = true;
    tiltBtn.classList.add('on');
    window.addEventListener('deviceorientation', onOrient);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') begin(); }).catch(() => {});
  } else if (typeof DeviceOrientationEvent !== 'undefined'){
    begin();
  }
  /* if neither path fires, the button simply stays off — touch steering always works */
});

/* ============================================================
   THE WORLD OUT THE WINDSHIELD
   Cruise: sky, sun, one horizon, a sea of cloud tops.
   Low: soft fields fade in. Airport phases: a simple,
   friendly runway in honest perspective.
   ============================================================ */
function groundVisAmt(){
  if (S.phase === 'ground' || S.phase === 'takeoff' || S.phase === 'rollout') return 1;
  if (S.phase === 'landing') return clamp(0.3 + 0.7 * S.landP, 0, 1);
  return clamp(1 - (S.altitude - FIELD_ALT) / 2400, 0, 1);
}
function drawWorld(){
  const v = L.view;
  const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
  const altT = clamp((S.altitude - FIELD_ALT) / 36000, 0, 1);
  const gv = groundVisAmt();
  const rollTotal = rad(S.bankDeg);

  ctx.save();
  roundRectPath(ctx, v.x, v.y, v.w, v.h, 16);
  ctx.clip();

  /* touchdown bump */
  if (S.shakeT > 0){
    const s = S.shakeT * 7;
    ctx.translate(rand(-s, s), rand(-s, s) * 0.7);
  }

  /* sky — rich gradient, deepening toward the top of the climb */
  const top = lerpColor([52, 124, 218], [7, 16, 58], Math.pow(altT, 0.75));
  const mid = lerpColor([120, 182, 238], [30, 56, 116], Math.pow(altT, 0.85));
  const low = lerpColor([203, 230, 250], [98, 120, 170], altT);
  const g = ctx.createLinearGradient(0, v.y, 0, v.y + v.h);
  g.addColorStop(0, css(top)); g.addColorStop(0.62, css(mid)); g.addColorStop(1, css(low));
  ctx.fillStyle = g;
  ctx.fillRect(v.x - 8, v.y - 8, v.w + 16, v.h + 16);

  /* faint stars at the very top of the sky */
  if (altT > 0.45){
    ctx.save();
    ctx.fillStyle = '#e6eeff';
    for (const st of skyStars){
      const tw = 0.5 + 0.5 * Math.sin(S.time * 2 + st.p);
      ctx.globalAlpha = (altT - 0.45) * 1.6 * tw;
      ctx.beginPath(); ctx.arc(v.x + st.fx * v.w, v.y + st.fy * v.h, st.r, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  /* sun with a soft glow, drifting gently with heading */
  const sunX = cx + v.w * 0.21 + Math.sin(rad(S.heading) * 0.7) * v.w * 0.13;
  const sunY = v.y + v.h * 0.24 - altT * v.h * 0.05;
  ctx.save();
  const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, v.h * 0.42);
  glow.addColorStop(0, 'rgba(255,244,190,0.9)');
  glow.addColorStop(0.18, 'rgba(255,230,150,0.4)');
  glow.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sunX - v.h * 0.42, sunY - v.h * 0.42, v.h * 0.84, v.h * 0.84);
  ctx.fillStyle = '#fff6d8';
  ctx.beginPath(); ctx.arc(sunX, sunY, v.h * 0.045, 0, 6.29); ctx.fill();
  ctx.restore();

  /* ---- everything below the horizon pitches and rolls ---- */
  ctx.save();
  ctx.translate(cx, cy + S.pitchDeg * v.h * 0.030);
  ctx.rotate(-rollTotal);
  const BW = v.w * 1.7, BH = v.h * 2.4;

  if (gv > 0.01){
    ctx.save();
    ctx.globalAlpha = gv;
    drawGroundLayer(v, BW, BH);
    ctx.restore();
  }
  if (gv < 0.99){
    ctx.save();
    ctx.globalAlpha = 1 - gv;
    drawCloudDeck(v, BW, BH, altT);
    ctx.restore();
  }
  ctx.restore(); /* end horizon world */

  /* a few slow puffs drifting past the canopy in flight */
  if (S.phase === 'air' && puffSprite){
    for (const c of clouds){
      const k = 1 - c.z;
      const px = cx + c.dx * k * v.w * 0.78;
      const py = cy + c.dy * k * v.h * 0.9 + S.pitchDeg * 2.4 * k;
      const size = (30 + k * k * 330) * c.s0;
      ctx.save();
      ctx.globalAlpha = Math.sin(Math.min(k * 1.25, 1) * Math.PI) * 0.5;
      ctx.drawImage(puffSprite, px - size / 2, py - size * 0.31, size, size * 0.62);
      ctx.restore();
    }
  }

  /* landing celebration, seen through the windshield */
  if (confetti.length){
    ctx.save();
    for (const p of confetti){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = clamp(p.life / 1.2, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    ctx.restore();
  }

  /* dim the world until the engines spool up */
  if (S.power < 1){
    ctx.fillStyle = 'rgba(8,12,22,' + ((1 - S.power) * 0.38) + ')';
    ctx.fillRect(v.x - 6, v.y - 6, v.w + 12, v.h + 12);
  }
  ctx.restore(); /* unclip view */

  /* faint glass reflection */
  ctx.save();
  roundRectPath(ctx, v.x, v.y, v.w, v.h, 16);
  ctx.clip();
  const rg = ctx.createLinearGradient(v.x, v.y, v.x + v.w, v.y + v.h);
  rg.addColorStop(0, 'rgba(255,255,255,0.06)');
  rg.addColorStop(0.35, 'rgba(255,255,255,0)');
  rg.addColorStop(0.78, 'rgba(255,255,255,0)');
  rg.addColorStop(1, 'rgba(255,255,255,0.04)');
  ctx.fillStyle = rg;
  ctx.fillRect(v.x, v.y, v.w, v.h);
  ctx.restore();

  drawWindshieldFrame(v);
}

/* soft ground: quiet fields and a coastline, low contrast */
function drawGroundLayer(v, BW, BH){
  const agl = S.altitude - FIELD_ALT;
  ctx.fillStyle = '#6da354';
  ctx.fillRect(-BW, 0, BW * 2, BH);
  if (S.airportVis){
    drawAirport(v, BW, BH);
  } else {
  /* patchwork, but soft and simple — big shapes, low contrast */
  const altScale = clamp(9500 / Math.max(S.altitude, 900), 0.55, 2.4);
  const cellW = 300 * altScale, cellH = 200 * altScale;
  const offX = (S.dist * 0.4) % cellW, offY = S.groundDist % cellH;
  const rowBase = Math.floor(S.groundDist / cellH);
  const fieldCols = ['#79a857', '#86b364', '#bfae72', '#94ba68', '#6f9c50', '#c2b47e'];
  const rows = Math.ceil(BH / cellH) + 2, cols = Math.ceil(BW * 2 / cellW) + 2;
  for (let j = -1; j < rows; j++){
    for (let i = -2; i < cols; i++){
      ctx.fillStyle = fieldCols[Math.floor(hash2(i, j + rowBase) * fieldCols.length)];
      ctx.fillRect(-BW + i * cellW - offX, j * cellH - offY, cellW - 3, cellH - 3);
    }
  }
  /* coastline: calm sea along the left */
  const coastBase = -BW * 0.42 + Math.sin(rad(S.heading) * 2.0) * v.w * 0.2;
  ctx.fillStyle = 'rgba(58,110,168,0.9)';
  ctx.beginPath();
  ctx.moveTo(-BW, -4);
  for (let yy = -4; yy <= BH; yy += 42){
    ctx.lineTo(coastBase + Math.sin(yy * 0.004 + 1.7) * 46 + Math.sin(yy * 0.013 + 0.4) * 17, yy);
  }
  ctx.lineTo(-BW, BH);
  ctx.closePath(); ctx.fill();
  }
  /* horizon haze */
  const hz = ctx.createLinearGradient(0, -26, 0, 34);
  hz.addColorStop(0, 'rgba(235,244,255,0)');
  hz.addColorStop(0.45, 'rgba(235,244,255,0.45)');
  hz.addColorStop(1, 'rgba(235,244,255,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(-BW, -26, BW * 2, 60);
  if (agl < 60) return;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(-BW, -1, BW * 2, 2);
}

/* the friendly little airport, in perspective */
function drawAirport(v, BW, BH){
  const vw = v.w;
  let yFar, wFar, wNear, alpha = 1;
  if (S.phase === 'landing'){
    const e = easeInOut(S.landP);
    yFar = lerp(v.h * 0.30, 3, e);
    wFar = lerp(3, 15, e);
    wNear = lerp(vw * 0.07, vw * 0.44, e);
  } else if (S.phase === 'air'){
    const s = clamp(1 - (S.altitude - FIELD_ALT) / 2300, 0, 1);
    yFar = 3 + (1 - s) * 46;
    wFar = 2 + 13 * s;
    wNear = vw * 0.44 * s;
    alpha = s;
  } else {
    yFar = 3; wFar = 15; wNear = vw * 0.44;
  }
  const yNear = BH;
  const persp = u => Math.pow(u, 2.6);
  const yAt = u => yFar + (yNear - yFar) * persp(u);
  const wAt = u => wFar + (wNear - wFar) * persp(u);

  ctx.save();
  ctx.globalAlpha *= alpha;
  /* grass detail: a few soft darker patches scrolling by */
  ctx.fillStyle = 'rgba(70,120,55,0.35)';
  for (let i = 0; i < 5; i++){
    const uu = 0.22 + ((i * 0.19 + (S.groundDist * 0.0011)) % 0.75);
    const yy = yAt(uu), ww = wAt(uu);
    ctx.beginPath();
    ctx.ellipse((i % 2 ? 1 : -1) * (ww * 0.85 + 60), yy, 60 + persp(uu) * 130, 10 + persp(uu) * 26, 0, 0, 6.29);
    ctx.fill();
  }
  /* runway surface */
  ctx.beginPath();
  ctx.moveTo(-wFar / 2, yFar);
  ctx.lineTo(wFar / 2, yFar);
  ctx.lineTo(wNear / 2, yNear);
  ctx.lineTo(-wNear / 2, yNear);
  ctx.closePath();
  const rwg = ctx.createLinearGradient(0, yFar, 0, yNear);
  rwg.addColorStop(0, '#43464d'); rwg.addColorStop(1, '#33363c');
  ctx.fillStyle = rwg;
  ctx.fill();
  /* edge lines */
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-wFar / 2, yFar); ctx.lineTo(-wNear / 2, yNear);
  ctx.moveTo(wFar / 2, yFar); ctx.lineTo(wNear / 2, yNear);
  ctx.stroke();
  /* threshold piano keys */
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 6; i++){
    const fx = -0.38 + i * 0.152;
    const u0 = 0.015, u1 = 0.085;
    ctx.beginPath();
    ctx.moveTo(fx * wAt(u0), yAt(u0));
    ctx.lineTo((fx + 0.075) * wAt(u0), yAt(u0));
    ctx.lineTo((fx + 0.075) * wAt(u1), yAt(u1));
    ctx.lineTo(fx * wAt(u1), yAt(u1));
    ctx.closePath(); ctx.fill();
  }
  /* centerline dashes streaming past */
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  const N = 13;
  const phaseU = (S.groundDist * 0.0035) % (1 / N);
  for (let i = -1; i < N; i++){
    const u0 = i / N + phaseU;
    if (u0 < 0.06 || u0 > 1) continue;
    const u1 = u0 + 0.42 / N;
    const dw = Math.max(1.2, wAt(u0) * 0.035);
    ctx.beginPath();
    ctx.moveTo(-dw / 2, yAt(u0));
    ctx.lineTo(dw / 2, yAt(u0));
    ctx.lineTo(Math.max(1.2, wAt(u1) * 0.035) / 2, yAt(u1));
    ctx.lineTo(-Math.max(1.2, wAt(u1) * 0.035) / 2, yAt(u1));
    ctx.closePath(); ctx.fill();
  }
  /* edge lights */
  for (let i = 0; i <= 15; i++){
    const u = 0.03 + (i / 15) * 0.97;
    const yy = yAt(u), ww = wAt(u), f = persp(u);
    const r = 0.8 + f * 2.4;
    ctx.save();
    ctx.fillStyle = '#ffe9b0';
    ctx.shadowColor = 'rgba(255,220,140,0.9)'; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(-ww * 0.58, yy, r, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(ww * 0.58, yy, r, 0, 6.29); ctx.fill();
    ctx.restore();
  }
  /* PAPI lights on final: two white, two red — right on glidepath */
  if (S.phase === 'landing' && S.landP > 0.2){
    const u = 0.1, yy = yAt(u), ww = wAt(u);
    const cols = ['#ffffff', '#ffffff', '#ff5148', '#ff5148'];
    for (let i = 0; i < 4; i++){
      ctx.save();
      ctx.fillStyle = cols[i];
      ctx.shadowColor = cols[i]; ctx.shadowBlur = 7;
      ctx.fillRect(-ww * 0.62 - 26 + i * 8, yy - 2.5, 5.5, 5);
      ctx.restore();
    }
  }
  drawAirportBuildings(yAt, wAt, persp);
  ctx.restore();
}
function drawAirportBuildings(yAt, wAt, persp){
  /* two building groups per side; they slide past as the jet rolls */
  const rolling = S.phase === 'ground' || S.phase === 'takeoff' || S.phase === 'rollout';
  for (const side of [-1, 1]){
    for (let gi = 0; gi < 2; gi++){
      let u;
      if (S.phase === 'landing') u = gi === 0 ? 0.30 : 0.62;
      else if (rolling) u = ((gi * 0.5 + (side > 0 ? 0.13 : 0.31) + S.groundDist * 0.0011) % 1);
      else u = gi === 0 ? 0.30 : 0.62;
      if (u < 0.05 || u > 0.97) continue;
      const yy = yAt(u), ww = wAt(u), f = persp(u);
      const bx = side * (ww * 0.72 + 26 + f * 120);
      const s = 0.3 + f * 2.2;
      ctx.save();
      ctx.translate(bx, yy);
      ctx.scale(s, s);
      if (side > 0){
        /* terminal + control tower */
        ctx.fillStyle = '#9aa4ae';
        ctx.fillRect(-52, -20, 104, 20);
        ctx.fillStyle = '#7e8894';
        ctx.fillRect(-52, -20, 104, 5);
        ctx.fillStyle = '#5d7d99';
        for (let wi = 0; wi < 5; wi++) ctx.fillRect(-44 + wi * 19, -13, 12, 6);
        ctx.fillStyle = '#8b95a1';
        ctx.fillRect(30, -46, 7, 26);
        ctx.fillStyle = '#54687c';
        ctx.fillRect(25, -54, 17, 9);
        ctx.fillStyle = '#a8e6ff';
        ctx.fillRect(27, -52, 13, 5);
      } else {
        /* parked planes */
        for (let pi = 0; pi < 2; pi++){
          const px = -30 + pi * 58, py = -4 - pi * 7;
          ctx.fillStyle = '#e8ecf1';
          ctx.beginPath(); ctx.ellipse(px, py, 21, 5.5, 0, 0, 6.29); ctx.fill();
          ctx.fillStyle = '#d5dbe3';
          ctx.beginPath();
          ctx.moveTo(px - 17, py - 2); ctx.lineTo(px - 24, py - 13); ctx.lineTo(px - 18, py - 13); ctx.lineTo(px - 12, py - 3);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#3f7fbf';
          ctx.fillRect(px - 20, py - 12.5, 4.5, 4.5);
          ctx.fillStyle = '#7fb2e0';
          for (let wi = 0; wi < 4; wi++) ctx.fillRect(px - 6 + wi * 6, py - 2.5, 3, 2.4);
        }
      }
      ctx.restore();
    }
  }
}

/* the cruise cloud deck: layered soft cloud tops to the horizon */
function drawCloudDeck(v, BW, BH, altT){
  const dg = ctx.createLinearGradient(0, -4, 0, BH * 0.75);
  dg.addColorStop(0, '#eef4fb');
  dg.addColorStop(0.35, '#dbe7f4');
  dg.addColorStop(1, css(lerpColor([178, 198, 226], [130, 148, 196], altT)));
  ctx.fillStyle = dg;
  ctx.fillRect(-BW, 0, BW * 2, BH);
  /* drifting shadow patches give the deck its soft volume */
  ctx.fillStyle = 'rgba(110,135,180,0.13)';
  for (let i = 0; i < 4; i++){
    const sx = ((i * 0.37 + 0.13 + S.dist * 0.00035) % 1.3 - 0.65) * BW * 2;
    const sy = 40 + i * 52 + Math.sin(i * 3.1) * 12;
    ctx.beginPath(); ctx.ellipse(sx, sy, 120 + i * 40, 16 + i * 5, 0, 0, 6.29); ctx.fill();
  }
  /* puff rows: small and dense at the horizon, big and soft below */
  if (deckSprite){
    for (let r = 0; r < 6; r++){
      const yy = 3 + r * r * 6.2;
      const sc = 0.34 + r * 0.30;
      const dw = 300 * sc, dh = 110 * sc;
      const spacing = dw * 0.82;
      const scroll = (S.dist * (0.010 + r * 0.006) + r * 131) % spacing;
      ctx.save();
      ctx.globalAlpha *= 0.5 + r * 0.09;
      for (let x = -BW - spacing; x < BW + spacing; x += spacing){
        ctx.drawImage(deckSprite, x + scroll - dw / 2, yy - dh * 0.4, dw, dh);
      }
      ctx.restore();
    }
  }
  /* haze hugging the horizon, and the line itself */
  const hz = ctx.createLinearGradient(0, -30, 0, 30);
  hz.addColorStop(0, 'rgba(240,247,255,0)');
  hz.addColorStop(0.5, 'rgba(240,247,255,0.55)');
  hz.addColorStop(1, 'rgba(240,247,255,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(-BW, -30, BW * 2, 60);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(-BW, -1, BW * 2, 2);
}

/* airliner window frames: two front panes, center posts, side panes */
function drawWindshieldFrame(v){
  ctx.save();
  ctx.fillStyle = '#14161a';
  const post = (x0, y0, ang, len, wdt) => {
    ctx.save();
    ctx.translate(x0, y0);
    ctx.rotate(ang);
    ctx.fillRect(-wdt / 2, -26, wdt, len);
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.fillRect(wdt / 2 - 3, -26, 3, len);
    ctx.restore();
    ctx.fillStyle = '#14161a';
  };
  /* A-pillars at the outer edges only — the central field of view
     stays completely clear, one wide pane of glass */
  post(v.x + 5, v.y + v.h * 0.05, 0.20, v.h * 0.98, 15);
  post(v.x + v.w - 5, v.y + v.h * 0.05, -0.20, v.h * 0.98, 15);
  /* frame border */
  ctx.strokeStyle = '#0e1013';
  ctx.lineWidth = 9;
  roundRectPath(ctx, v.x, v.y, v.w, v.h, 16);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1.5;
  roundRectPath(ctx, v.x + 5, v.y + 5, v.w - 10, v.h - 10, 12);
  ctx.stroke();
  /* glareshield shelf + its shadow onto the panel */
  const gy = v.y + v.h - 16;
  const gg = ctx.createLinearGradient(0, gy, 0, gy + 24);
  gg.addColorStop(0, '#26282e'); gg.addColorStop(1, '#0e0f12');
  ctx.fillStyle = gg;
  roundRectPath(ctx, v.x - 4, gy, v.w + 8, 24, 8);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.fillRect(v.x + 2, gy + 1, v.w - 4, 1.5);
  const sh = ctx.createLinearGradient(0, gy + 24, 0, gy + 42);
  sh.addColorStop(0, 'rgba(0,0,0,0.4)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.fillRect(v.x - 4, gy + 24, v.w + 8, 18);
  ctx.restore();
}

/* ============================================================
   THE FLIGHT DECK PANEL — fewer, bigger, grouped elements.
   PFD · ND · placard + working buttons + TAKE OFF/LAND ·
   twin thrust levers · two yokes.
   ============================================================ */
function drawScrew(x, y){
  ctx.save();
  ctx.fillStyle = '#0e0f12';
  ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 6.29); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 6.29); ctx.stroke();
  const a = hash2(x, y) * 3;
  ctx.strokeStyle = 'rgba(200,210,225,0.5)';
  ctx.beginPath();
  ctx.moveTo(x - Math.cos(a) * 2.2, y - Math.sin(a) * 2.2);
  ctx.lineTo(x + Math.cos(a) * 2.2, y + Math.sin(a) * 2.2);
  ctx.stroke();
  ctx.restore();
}
function drawLED(x, y, r, color, on){
  ctx.save();
  if (on){
    ctx.shadowColor = color; ctx.shadowBlur = 9;
    ctx.fillStyle = color;
  } else {
    ctx.fillStyle = '#1d2025';
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.stroke();
  if (on){
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.32, 0, 6.29); ctx.fill();
  }
  ctx.restore();
}
function dispFrame(rect){
  ctx.save();
  const bg = ctx.createLinearGradient(0, rect.y, 0, rect.y + rect.h);
  bg.addColorStop(0, '#101216'); bg.addColorStop(1, '#08090b');
  ctx.fillStyle = bg;
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 10);
  ctx.stroke();
  drawScrew(rect.x + 9, rect.y + 9); drawScrew(rect.x + rect.w - 9, rect.y + 9);
  drawScrew(rect.x + 9, rect.y + rect.h - 9); drawScrew(rect.x + rect.w - 9, rect.y + rect.h - 9);
  const inner = { x: rect.x + 7, y: rect.y + 7, w: rect.w - 14, h: rect.h - 14 };
  ctx.fillStyle = '#04070a';
  roundRectPath(ctx, inner.x, inner.y, inner.w, inner.h, 6);
  ctx.fill();
  ctx.save();
  roundRectPath(ctx, inner.x, inner.y, inner.w, inner.h, 6);
  ctx.clip();
  ctx.translate(inner.x, inner.y);
  return inner;
}
function dispGlass(inner){
  ctx.restore(); /* unclip */
  const gl = ctx.createLinearGradient(inner.x, inner.y, inner.x + inner.w, inner.y + inner.h);
  gl.addColorStop(0, 'rgba(255,255,255,' + (S.lightsNight ? 0.03 : 0.07) + ')');
  gl.addColorStop(0.4, 'rgba(255,255,255,0)');
  gl.addColorStop(1, 'rgba(255,255,255,0.02)');
  ctx.fillStyle = gl;
  roundRectPath(ctx, inner.x, inner.y, inner.w, inner.h, 6);
  ctx.fill();
  ctx.restore(); /* matches dispFrame save */
}
function dispLabel(text, x, y, color){
  ctx.fillStyle = color || '#8fd8c0';
  ctx.font = '600 10px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

/* ---------------- PFD: attitude + speed/altitude tapes ---------------- */
function drawTape(x, w, h, value, pxPer, step, labelStep, fmt, boxFmt){
  const cy = h / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(6,12,20,0.88)';
  ctx.fillRect(x, 0, w, h);
  ctx.beginPath(); ctx.rect(x, 0, w, h); ctx.clip();
  ctx.font = '600 9px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const range = cy / pxPer + step * 2;
  const v0 = Math.floor((value - range) / step) * step;
  for (let val = v0; val <= value + range; val += step){
    if (val < 0) continue;
    const yy = cy + (value - val) * pxPer;
    const major = Math.abs(val / labelStep - Math.round(val / labelStep)) < 0.01;
    ctx.strokeStyle = 'rgba(235,240,248,0.85)';
    ctx.lineWidth = major ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(x + w - (major ? 9 : 5), yy);
    ctx.lineTo(x + w, yy);
    ctx.stroke();
    if (major) ctx.fillStyle = 'rgba(235,240,248,0.92)', ctx.fillText(fmt(val), x + w / 2 - 3, yy);
  }
  ctx.restore();
  /* current-value box, riding the center of the tape */
  ctx.save();
  ctx.fillStyle = '#04060a';
  const bw = w + 8, bh = 17;
  roundRectPath(ctx, x - 4, cy - bh / 2, bw, bh, 3);
  ctx.fill();
  ctx.strokeStyle = '#8affc1'; ctx.lineWidth = 1.2;
  roundRectPath(ctx, x - 4, cy - bh / 2, bw, bh, 3);
  ctx.stroke();
  ctx.fillStyle = '#8affc1';
  ctx.font = '600 12.5px Barlow, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText((boxFmt || fmt)(Math.max(value, 0)), x + w / 2, cy + 0.5);
  ctx.restore();
}
function drawPFD(){
  const inner = dispFrame(L.pfd);
  const w = inner.w, h = inner.h;
  ctx.save();
  ctx.globalAlpha = S.effPower;
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0a1626'); bg.addColorStop(1, '#050b14');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  const spdW = clamp(w * 0.21, 34, 48);
  const altW = clamp(w * 0.24, 38, 54);
  const ax = spdW + 2, aw = w - spdW - altW - 4;
  const acx = ax + aw / 2, acy = h / 2 - 4;

  /* attitude ball */
  ctx.save();
  ctx.beginPath(); ctx.rect(ax, 4, aw, h - 26); ctx.clip();
  ctx.save();
  ctx.translate(acx, acy);
  ctx.rotate(-rad(S.bankDeg));
  ctx.translate(0, S.pitchDeg * 2.1);
  const sky = ctx.createLinearGradient(0, -h, 0, 0);
  sky.addColorStop(0, '#3a7cc2'); sky.addColorStop(1, '#8fc0ea');
  ctx.fillStyle = sky;
  ctx.fillRect(-aw, -h, aw * 2, h);
  const gnd = ctx.createLinearGradient(0, 0, 0, h);
  gnd.addColorStop(0, '#8a6a42'); gnd.addColorStop(1, '#5f4630');
  ctx.fillStyle = gnd;
  ctx.fillRect(-aw, 0, aw * 2, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.6;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-aw * 0.30, s * 21); ctx.lineTo(aw * 0.30, s * 21); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-aw * 0.18, s * 42); ctx.lineTo(aw * 0.18, s * 42); ctx.stroke();
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-aw, -1.4, aw * 2, 2.8);
  ctx.restore();
  /* fixed aircraft symbol */
  ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(acx - aw * 0.34, acy); ctx.lineTo(acx - aw * 0.13, acy); ctx.lineTo(acx - aw * 0.08, acy + aw * 0.08);
  ctx.moveTo(acx + aw * 0.34, acy); ctx.lineTo(acx + aw * 0.13, acy); ctx.lineTo(acx + aw * 0.08, acy + aw * 0.08);
  ctx.stroke();
  ctx.fillStyle = '#ffd94d';
  ctx.beginPath(); ctx.arc(acx, acy, 3, 0, 6.29); ctx.fill();
  /* roll pointer */
  ctx.save();
  ctx.translate(acx, acy);
  ctx.rotate(-rad(S.bankDeg));
  ctx.fillStyle = '#ffd94d';
  ctx.beginPath();
  ctx.moveTo(0, -h / 2 + 12); ctx.lineTo(-4.5, -h / 2 + 21); ctx.lineTo(4.5, -h / 2 + 21);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.6;
  for (const a of [-30, 0, 30]){
    const ar = rad(a - 90);
    const r0 = h / 2 - 8, r1 = h / 2 - (a === 0 ? 15 : 12);
    ctx.beginPath();
    ctx.moveTo(acx + Math.cos(ar) * r0, acy + Math.sin(ar) * r0);
    ctx.lineTo(acx + Math.cos(ar) * r1, acy + Math.sin(ar) * r1);
    ctx.stroke();
  }
  ctx.restore();

  /* tapes */
  drawTape(0, spdW, h - 18, S.speed, 0.5, 10, 20, v => String(Math.round(v)));
  drawTape(w - altW, altW, h - 18, S.altitude, 0.045, 100, 500, v => String(Math.round(v / 100)), v => fmtInt(v));
  /* heading readout rides the bottom of the attitude ball, clear of the yoke */
  ctx.fillStyle = '#04060a';
  roundRectPath(ctx, acx - 24, h - 48, 48, 14, 3);
  ctx.fill();
  ctx.strokeStyle = '#2c2f36'; ctx.lineWidth = 1;
  roundRectPath(ctx, acx - 24, h - 48, 48, 14, 3);
  ctx.stroke();
  ctx.fillStyle = '#8affc1';
  ctx.font = '600 11px Barlow, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fmtHdg(S.heading) + '°', acx, h - 40.5);
  /* VSI mini-readout, bottom right */
  ctx.fillStyle = '#6fae9d';
  ctx.font = '600 9px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'right';
  const vsTxt = (S.vs >= 0 ? '+' : '−') + fmtInt(Math.abs(S.vs));
  ctx.fillText('VS ' + vsTxt, w - 4, h - 10);
  dispLabel('PFD', 5, 3);
  ctx.restore();
  dispGlass(inner);
}

/* ---------------- ND: navigation display ---------------- */
function drawND(){
  const inner = dispFrame(L.nd);
  const w = inner.w, h = inner.h;
  ctx.save();
  ctx.globalAlpha = S.effPower;
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0b1c2a'); bg.addColorStop(1, '#06121c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  const ccx = w / 2, ccy = h / 2 + 4, R = Math.min(w, h) / 2 - 9;
  /* range rings */
  ctx.strokeStyle = 'rgba(110,220,180,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(ccx, ccy, R * 0.5, 0, 6.29); ctx.stroke();
  ctx.beginPath(); ctx.arc(ccx, ccy, R, 0, 6.29); ctx.stroke();
  /* a soft weather cell */
  const wxg = ctx.createRadialGradient(ccx + R * 0.48, ccy - R * 0.4, 2, ccx + R * 0.48, ccy - R * 0.4, R * 0.34);
  wxg.addColorStop(0, 'rgba(80,255,140,0.30)');
  wxg.addColorStop(1, 'rgba(80,255,140,0)');
  ctx.fillStyle = wxg;
  ctx.beginPath(); ctx.arc(ccx + R * 0.48, ccy - R * 0.4, R * 0.34, 0, 6.29); ctx.fill();
  /* the route ahead: dashed amber curve with waypoints */
  const pts = [[0, 0.86], [-0.16, 0.42], [0.05, 0.05], [0.28, -0.38], [0.42, -0.78]];
  ctx.strokeStyle = 'rgba(255,217,77,0.9)';
  ctx.lineWidth = 2.2;
  ctx.setLineDash([6, 5]);
  ctx.lineDashOffset = -S.dist * 0.12;
  ctx.beginPath();
  ctx.moveTo(ccx + pts[0][0] * R, ccy + pts[0][1] * R);
  for (let i = 1; i < pts.length - 1; i++){
    const mx = ccx + (pts[i][0] + pts[i + 1][0]) / 2 * R, my = ccy + (pts[i][1] + pts[i + 1][1]) / 2 * R;
    ctx.quadraticCurveTo(ccx + pts[i][0] * R, ccy + pts[i][1] * R, mx, my);
  }
  ctx.lineTo(ccx + pts[pts.length - 1][0] * R, ccy + pts[pts.length - 1][1] * R);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff';
  for (const p of pts){
    ctx.beginPath(); ctx.arc(ccx + p[0] * R, ccy + p[1] * R, 2.8, 0, 6.29); ctx.fill();
  }
  /* compass rose, track-up */
  ctx.fillStyle = 'rgba(235,240,248,0.9)';
  ctx.strokeStyle = 'rgba(235,240,248,0.75)';
  ctx.font = '600 9px "Barlow Condensed", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let a = 0; a < 360; a += 15){
    const ar = rad(a - S.heading - 90);
    const major = a % 30 === 0;
    ctx.lineWidth = major ? 1.8 : 1;
    ctx.beginPath();
    ctx.moveTo(ccx + Math.cos(ar) * (R - 1), ccy + Math.sin(ar) * (R - 1));
    ctx.lineTo(ccx + Math.cos(ar) * (R - (major ? 8 : 5)), ccy + Math.sin(ar) * (R - (major ? 8 : 5)));
    ctx.stroke();
    if (major){
      let lab;
      if (a === 0) lab = 'N'; else if (a === 90) lab = 'E';
      else if (a === 180) lab = 'S'; else if (a === 270) lab = 'W';
      else lab = String(a / 10).padStart(2, '0');
      ctx.fillText(lab, ccx + Math.cos(ar) * (R - 15), ccy + Math.sin(ar) * (R - 15));
    }
  }
  /* own-ship symbol, nose up */
  ctx.fillStyle = '#ffd94d';
  ctx.strokeStyle = '#3a2c00'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(ccx, ccy - 9); ctx.lineTo(ccx + 2.6, ccy - 1.5); ctx.lineTo(ccx + 9, ccy + 5.5);
  ctx.lineTo(ccx + 9, ccy + 7.8); ctx.lineTo(ccx + 3, ccy + 5.8); ctx.lineTo(ccx + 3, ccy + 8.8);
  ctx.lineTo(ccx + 5, ccy + 11); ctx.lineTo(ccx - 5, ccy + 11); ctx.lineTo(ccx - 3, ccy + 8.8);
  ctx.lineTo(ccx - 3, ccy + 5.8); ctx.lineTo(ccx - 9, ccy + 7.8); ctx.lineTo(ccx - 9, ccy + 5.5);
  ctx.lineTo(ccx - 2.6, ccy - 1.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();

/* ============================================================
   UPDATE — a heavy jet, flown gently.
   Drag sets a TARGET attitude behind a generous dead zone;
   pitch and bank ease toward it with strong damping and hard
   rate caps. Release the sky and it settles back to level.
   ============================================================ */
function update(dt){
  S.time += dt;

  /* twin engines spool up after START ENGINES */
  if (S.started && S.spool < 1) S.spool = Math.min(1, S.spool + dt / 3);
  S.power = S.spool;
  S.effPower = S.spool >= 1 ? 1 : S.spool * (0.85 + 0.15 * Math.random());

  /* thrust levers walk toward their command when the plane drives */
  if (S.autoThrottle){
    S.throttle += clamp(S.throttleCmd - S.throttle, -dt * 0.55, dt * 0.55);
  }

  /* ---- steering input, with a generous dead zone ---- */
  let pIn = 0, bIn = 0;
  if (S.viewActive){ pIn = S.inPitch; bIn = S.inBank; }
  else if (S.tiltOn){ pIn = S.tiltPitch; bIn = S.tiltBank; }
  const dead = v => { const a = Math.abs(v); return a < 0.18 ? 0 : Math.sign(v) * (a - 0.18) / 0.82; };
  let pitchTgt = 0, bankTgt = 0;
  const prevAlt = S.altitude;

  if (S.phase === 'ground'){
    S.speed = Math.max(0, S.speed - dt * 14);
  }
  else if (S.phase === 'takeoff'){
    const a = S.throttle * 15.5 - S.speed * 0.016 - 1.6;
    S.speed = Math.max(0, S.speed + a * dt);
    S.groundDist += S.speed * dt * 0.55;
    if (S.speed >= 138) S.rotateProg = Math.min(1, S.rotateProg + dt / 1.7);
    pitchTgt = 9.5 * smooth(S.rotateProg);
    if (S.rotateProg > 0.5 && S.speed >= 145) liftoff();
    /* abort only when the captain himself drags the levers back */
    else if (!S.autoThrottle && S.throttle < 0.3 && S.speed < 15){ S.phase = 'ground'; }
  }
  else if (S.phase === 'air'){
    pitchTgt = dead(pIn) >= 0 ? dead(pIn) * 10 : dead(pIn) * 8;
    bankTgt = dead(bIn) * 22;
    if (S.autopilot && !S.viewActive){
      pitchTgt = Math.sin(S.time * 0.7) * 0.8;
      bankTgt = Math.sin(S.time * 0.45) * 3;
    }
    const agl = S.altitude - FIELD_ALT;
    /* gentle climb-out bias after liftoff — but it yields the moment
       the captain actually holds the yoke himself */
    const pilotHolding = S.viewActive || (S.tiltOn && (Math.abs(pIn) > 0.01 || Math.abs(bIn) > 0.01));
    if (agl < 2200 && !pilotHolding) pitchTgt = Math.max(pitchTgt, 8 * (1 - agl / 2200));
    /* low-altitude assist: a soft floor near the ground that lifts
       him gently — a cushion, not a wall */
    S.assist = agl < 1100 && S.spool > 0.6;
    if (S.assist){
      const floor = (1100 - agl) / 1100 * 5.5;
      if (pitchTgt < floor) pitchTgt = floor;
      if (S.time > S.nextBeep){ AudioSys.assistBeep(); S.nextBeep = S.time + 1.4; }
    } else S.assist = false;
    if (S.altitude > 37200 && pitchTgt > 0) pitchTgt = 0;
    /* stately speed: thrust sets a target, the jet drifts toward it */
    const tSpeed = 250 + S.throttle * 230 - ((S.gearDown || S.gearTransit > 0) ? 18 : 0);
    S.speed += (tSpeed - S.speed) * Math.min(dt / 3.4, 1);
    S.groundDist += S.speed * dt * 0.55;
    /* vertical speed from attitude, gentle by airliner standards */
    const vsInst = S.pitchDeg * 135 * clamp(S.speed / 220, 0.55, 1);
    S.altitude = clamp(S.altitude + vsInst * dt / 60, FIELD_ALT, 38500);
    /* heading follows the bank, slowly */
    const hRate = (S.bankDeg / 22) * 2.1 * (S.speed > 60 ? 1 : S.speed / 60);
    S.heading = ((S.heading + hRate * dt) % 360 + 360) % 360;
    /* the gear comes up by itself if he forgets */
    if (S.gearAutoT > 0 && S.time > S.gearAutoT){
      S.gearAutoT = -1;
      if (S.gearDown) doGear(false);
    }
    if (S.gearHintT > 0) S.gearHintT -= dt;
    if (S.posRateT > 0 && S.time > S.posRateT){ S.posRateT = -1; AudioSys.positiveRate(); }
    if (agl > 2400) S.airportVis = false;
  }
  else if (S.phase === 'landing'){
    S.landT += dt;
    const p = clamp(S.landT / S.landDur, 0, 1);
    S.landP = p;
    const e = easeInOut(p);
    S.altitude = FIELD_ALT + (S.landStartAlt - FIELD_ALT) * Math.pow(1 - p, 1.25);
    const tSpeed = lerp(S.landStartSpeed, 126, e);
    S.speed += (tSpeed - S.speed) * Math.min(dt * 1.2, 1);
    S.throttle = lerp(S.landStartThr, 0.22, e);
    S.throttleCmd = S.throttle;
    let herr = ((0 - S.heading + 540) % 360) - 180;
    S.heading = ((S.heading + clamp(herr, -dt * 2.2, dt * 2.2)) % 360 + 360) % 360;
    bankTgt = clamp(herr * 0.25, -7, 7) * (1 - p * 0.7) + Math.sin(p * 9) * 1.2 * (1 - p);
    pitchTgt = p < 0.82 ? 1.2 : 1.2 + (p - 0.82) / 0.18 * 3.6;
    S.groundDist += S.speed * dt * 0.55;
    /* the helper makes sure the gear is down for him */
    if (p > 0.8 && !S.gearDown && S.gearTransit === 0) doGear(true);
    if (p >= 1) touchdown();
  }
  else if (S.phase === 'rollout'){
    S.speed = Math.max(0, S.speed + (-S.speed * 0.32 - 5) * dt);
    S.groundDist += S.speed * dt * 0.55;
    if (S.speed <= 1.5){ S.speed = 0; arrive(); }
  }

  /* ---- attitude: heavy damping, hard rate caps, no snap ---- */
  const pStep = clamp((pitchTgt - S.pitchDeg) * Math.min(dt / 0.8, 1), -4.2 * dt, 4.2 * dt);
  S.pitchDeg += pStep;
  const bStep = clamp((bankTgt - S.bankDeg) * Math.min(dt / 1.0, 1), -11 * dt, 11 * dt);
  S.bankDeg += bStep;
  if (S.phase === 'ground' || S.phase === 'rollout'){ S.pitchDeg = Math.max(0, S.pitchDeg - dt * 6); S.bankDeg *= Math.max(0, 1 - dt * 3); }

  /* VSI is the truth: derived from the altitude the model produced */
  const rawVs = dt > 0 ? (S.altitude - prevAlt) / dt * 60 : 0;
  S.vs += (rawVs - S.vs) * Math.min(dt * 2.5, 1);
  if (S.phase === 'ground' || S.phase === 'rollout' || S.phase === 'takeoff') S.vs *= Math.max(0, 1 - dt * 4);
  S.dist += S.speed * dt * 0.5;

  /* ---- timers ---- */
  if (S.gearTransit > 0){
    S.gearTransit = Math.max(0, S.gearTransit - dt / 1.4);
    if (S.gearTransit === 0) AudioSys.clunk(0.5);
  }
  if (S.radioT > 0) S.radioT -= dt;
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (S.celebrateT > 0) S.celebrateT -= dt;
  S.sweepA += dt * 1.15;

  /* clouds drift past, slower and softer than a fighter's */
  const dz = dt * (0.018 + (S.speed / 480) * 0.05);
  for (const c of clouds){
    c.z -= dz * (0.7 + c.s0 * 0.4);
    if (c.z <= 0.02) Object.assign(c, newCloud(false));
  }
  /* confetti physics */
  for (let i = confetti.length - 1; i >= 0; i--){
    const p = confetti[i];
    p.x += p.vx * dt + Math.sin(S.time * 3 + i) * 12 * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.life -= dt;
    if (p.life <= 0 || p.y > L.view.y + L.view.h + 16) confetti.splice(i, 1);
  }

  const onGround = S.phase === 'ground' || S.phase === 'takeoff' || S.phase === 'rollout';
  AudioSys.update(S.spool, S.throttle, S.speed, onGround, S.gearTransit);
}

let lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min((ts - lastTs) / 1000 || 0.016, 0.05);
  lastTs = ts;
  update(dt);
  drawWorld();
  drawPanel();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  measureSafe();
  computeLayout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));

makeSprites();
buildScenery();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
